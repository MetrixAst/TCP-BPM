name: CI

on:
  push:
    branches: [develop, sprint, main, preprod, 'feature/**']
  pull_request:
    branches: [develop, sprint, main, preprod]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_trc_bpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "True"
      DATABASE: postgres
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: test_trc_bpm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      TZ: Asia/Almaty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install pytest pytest-django pytest-cov
          fi
      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        working-directory: backend
        run: |
          if [ -f pytest.ini ]; then
            pytest
          else
            pytest apps --cov=apps --cov-report=term-missing --cov-fail-under=70 -q
          fi

  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t trc-bpm ./backend

  mobile-analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  mobile-build:
    needs: mobile-analyze-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=BASE_URL=https://api.metrix.example.com