{% load site_tags %}
<nav class="bpm-topbar__lang bpm-lang-switcher" aria-label="{% t 'topbar.language' 'Язык интерфейса' %}">
  <button type="button"
     class="bpm-topbar__lang-btn{% if current_lang == 'ru' %} is-active{% endif %}"
     onclick="BPM.switchLang('ru')"
     lang="ru">{% t 'topbar.lang_ru' 'Рус' %}</button>
  <button type="button"
     class="bpm-topbar__lang-btn{% if current_lang == 'kk' %} is-active{% endif %}"
     onclick="BPM.switchLang('kk')"
     lang="kk">{% t 'topbar.lang_kk' 'Қаз' %}</button>
  <button type="button"
     class="bpm-topbar__lang-btn{% if current_lang == 'en' %} is-active{% endif %}"
     onclick="BPM.switchLang('en')"
     lang="en">{% t 'topbar.lang_en' 'Eng' %}</button>
</nav>
