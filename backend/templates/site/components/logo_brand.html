{% load static %}
{# variant: full (default) | mono #}
{% if variant == 'mono' %}
<img class="bpm-logo__img bpm-logo__img--mono"
     src="{% static 'site/img/logo/metrix-mono.png' %}"
     alt="metrix"
     width="42"
     height="28"
     decoding="async" />
{% else %}
<img class="bpm-logo__img bpm-logo__img--full"
     src="{% static 'site/img/logo/metrix-full.png' %}"
     alt="metrix"
     width="140"
     height="35"
     decoding="async" />
{% endif %}
