{% load static site_tags %}

<header class="bpm-topbar" id="bpmTopbar">
  <button class="bpm-topbar__toggle"
          id="bpmSidebarToggle"
          type="button"
          aria-label="{% t 'topbar.toggle_menu' 'Открыть/закрыть меню' %}"
          aria-controls="bpmSidebar"
          aria-expanded="true">
    <i class="bi bi-layout-sidebar-inset"></i>
  </button>

  <a href="/" class="bpm-topbar__brand bpm-logo" aria-label="metriX BPM">
    {% include "site/components/logo_brand.html" %}
  </a>

  <div class="bpm-topbar__search">
    <i class="bi bi-search bpm-topbar__search-icon"></i>
    <input type="search"
           id="bpmSearch"
           class="bpm-topbar__search-input"
           placeholder="{% t 'topbar.search' 'Поиск...' %}"
           autocomplete="off"
           aria-label="{% t 'topbar.search' 'Поиск' %}"
           aria-expanded="false"
           aria-haspopup="listbox"
           aria-controls="bpmSearchResults" />
    <div class="bpm-topbar__search-results" id="bpmSearchResults" role="listbox" hidden>
      {# Содержимое генерируется через layout.js — renderGroupedResults() #}
    </div>
  </div>

  <div class="bpm-topbar__spacer"></div>

  <div class="bpm-topbar__right">

    {% include "site/components/lang_switcher.html" %}

    <div class="dropdown" id="bpmNotifRoot">
      <button class="bpm-topbar__icon-btn"
              type="button"
              data-bs-toggle="dropdown"
              data-bs-auto-close="outside"
              aria-expanded="false"
              aria-label="{% t 'topbar.notifications' 'Уведомления' %}"
              id="bpmNotifToggle">
        <i class="bi bi-bell"></i>
        <span class="bpm-topbar__notif-badge" id="bpmNotifBadge" hidden>0</span>
      </button>

      <div class="dropdown-menu dropdown-menu-end bpm-notif">
        <div class="bpm-notif__header">
          <span>{% t 'topbar.notifications_title' 'Уведомления' %}</span>
          <div class="bpm-notif__header-right">
            <span class="bpm-notif__count" id="bpmNotifCount" hidden></span>
            <button type="button"
                    class="bpm-notif__icon-btn"
                    id="bpmNotifMarkAllRead"
                    title="{% t 'topbar.notif_mark_all_read' 'Отметить все как прочитанные' %}"
                    aria-label="{% t 'topbar.notif_mark_all_read' 'Отметить все как прочитанные' %}"
                    hidden>
              <i class="bi bi-check2-all"></i>
            </button>
          </div>
        </div>

        <div class="bpm-notif__list" id="bpmNotifList">
          <div class="bpm-notif__empty" data-notif-loading>
            <i class="bi bi-arrow-repeat"></i>
            <span>{% t 'common.loading' 'Загрузка...' %}</span>
          </div>
        </div>

        <div class="bpm-notif__footer" id="bpmNotifFooter" hidden>
          <button type="button" class="bpm-notif__footer-btn" id="bpmNotifClearRead">{% t 'topbar.notif_clear_read' 'Удалить прочитанные' %}</button>
          <span class="bpm-notif__footer-sep">·</span>
          <button type="button" class="bpm-notif__footer-btn bpm-notif__footer-btn--danger" id="bpmNotifClearAll">{% t 'topbar.notif_clear_all' 'Удалить все' %}</button>
        </div>
      </div>
    </div>

    <a href="{% url 'account:logout' %}"
       class="bpm-topbar__icon-btn bpm-topbar__logout"
       title="{% t 'topbar.logout' 'Выйти' %}">
      <i class="bi bi-box-arrow-right"></i>
    </a>

  </div>
</header>
