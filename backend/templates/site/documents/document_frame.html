{% load static %}

{% if oo_enabled %}
<div class="doc-preview" id="docPreview">
  <div class="doc-preview__cover">
    <i class="bi bi-file-earmark-text-fill doc-preview__icon"></i>
    <div class="doc-preview__name">{{ document.title|default:document.number }}</div>
    <div class="doc-preview__actions">
      <a href="{% url 'documents:document_editor' document.id %}" target="_blank" rel="noopener"
         class="doc-detail-action-btn doc-detail-action-btn--primary">
        <i class="bi {% if oo_can_edit %}bi-pencil-square{% else %}bi-eye{% endif %}"></i>
        {% if oo_can_edit %}Редактировать документ{% else %}Открыть документ{% endif %}
      </a>
      <a href="{{ document.document.url }}" download
         class="doc-detail-action-btn doc-detail-action-btn--ghost">
        <i class="bi bi-download"></i> Скачать
      </a>
    </div>
  </div>
</div>

{% elif full_url %}
<div class="doc-preview" id="docPreview">
  <div class="doc-preview__cover">
    <i class="bi bi-file-earmark doc-preview__icon"></i>
    <div class="doc-preview__name">{{ document.title|default:document.number }}</div>
    <div class="doc-preview__actions">
      <a href="{{ document.document.url }}" download
         class="doc-detail-action-btn doc-detail-action-btn--primary">
        <i class="bi bi-download"></i> Скачать
      </a>
    </div>
  </div>
</div>

{% else %}
<div style="padding:32px;text-align:center;color:#9a98aa;font-size:13px;">
  К документу не прикреплён файл.
</div>
{% endif %}
