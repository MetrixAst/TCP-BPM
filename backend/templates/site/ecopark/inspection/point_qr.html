<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>QR — {{ point.name }}</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 32px; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        p { color: #64748b; margin-bottom: 24px; }
        #qr { margin-bottom: 16px; }
        .print-btn { padding: 10px 24px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        @media print { .print-btn { display: none; } }
    </style>
</head>
<body>
    <h1>{{ point.name }}</h1>
    <p>{{ point.get_point_type_display }} — {{ point.location }}</p>
    <div id="qr"></div>
    <button class="print-btn" onclick="window.print()">Распечатать</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById('qr'), {
            text: '{{ scan_url }}',
            width: 256,
            height: 256,
            colorDark: '#000',
            colorLight: '#fff',
        });
    </script>
</body>
</html>
