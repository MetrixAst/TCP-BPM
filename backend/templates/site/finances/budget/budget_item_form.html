<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">{{ title }}</h4>
        </div>
        <div class="card-body p-4">
            <p class="text-muted">Категория: <strong>{{ category.name }}</strong></p>
            
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between pt-3">
                    <a href="{% url 'finances:budget_detail' category.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    <button type="submit" class="btn btn-success px-4">Сохранить запись</button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
