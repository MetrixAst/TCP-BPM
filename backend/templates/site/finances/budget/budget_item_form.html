{% extends "site/base.html" %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'site/css/apps/finances.css' %}?v=fe54-budget">
{% endblock %}

{% block content %}
<section class="bud-form-page">
  <div class="bud-form-card">
    <div class="bud-form-head">
      <div>
        <h1>{{ title }}</h1>
        <p>Категория: <strong>{{ category.name }}</strong></p>
      </div>
      <a href="{% url 'finances:budget_detail' category.pk %}" class="bud-form-close">×</a>
    </div>

    <form method="post" class="bud-form">
      {% csrf_token %}

      {% for field in form %}
        <div class="bud-form-field">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="bud-error">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <div class="bud-form-footer">
        <a href="{% url 'finances:budget_detail' category.pk %}" class="bud-btn bud-btn--light">Отмена</a>
        <button type="submit" class="bud-btn bud-btn--primary">Сохранить</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
