{% load static %}
<!DOCTYPE html>
<html lang="{{ current_lang|default:'ru' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-отметка — metriX BPM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #f4f6fb;
      color: #25233f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result {
      width: min(100%, 420px);
      padding: 32px 24px;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .08);
      text-align: center;
    }
    .result__icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      color: #fff;
      background: {% if success %}#16a34a{% else %}#dc2626{% endif %};
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 24px; color: #64748b; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      color: #fff;
      background: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="result">
    <div class="result__icon">{% if success %}✓{% else %}!{% endif %}</div>
    <h1>{% if success %}Готово{% else %}Отметка не создана{% endif %}</h1>
    <p>{{ message }}</p>
    <a href="{% url 'hr:attendance_my' %}">Моя посещаемость</a>
  </main>
</body>
</html>
