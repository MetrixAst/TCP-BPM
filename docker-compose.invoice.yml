# Локальный стенд сервиса счетов (invoice/) рядом с BPM + единый gateway.
#
#   python3 invoice/dev/make_env.py
#   docker compose -f docker-compose.invoice.yml up -d --build
#   ngrok http 8088
#
# Gateway http://localhost:8088
#   /                 → BPM :8000
#   /invoice-api/     → FastAPI :8004
#   /invoice-admin/   → админка счетов
#   /invoice-portal/  → кабинет арендатора
#   /invoice-mock/    → заглушка Green API
name: trc-invoice

services:
  invoice_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    volumes:
      - invoice_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      retries: 10

  greenapi_mock:
    image: python:3.12-alpine
    command: python /app/greenapi_mock.py
    volumes:
      - ./invoice/dev/greenapi_mock.py:/app/greenapi_mock.py:ro
      - greenapi_mock_data:/data
    ports:
      - "127.0.0.1:8099:8080"

  invoice_api:
    build:
      context: ./invoice/backend
      args:
        ENV_FILE: .env.example
    env_file:
      - ./invoice/backend/.env.local
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://invoice:invoice@invoice_db:5432/invoice
      CORS_ORIGINS: '["http://localhost:8088","http://127.0.0.1:8088","https://a5a5-2a04-3b01-0-29-cc0b-1e1d-616f-1370.ngrok-free.app","http://localhost:5173","http://localhost:3003"]'
      KAFKA_ENABLED: "false"
      SENTRY_DSN: ""
      ONE_C_BASE_URL: http://127.0.0.1:9
      NOVA_BACKEND_URL: http://127.0.0.1:9
      NOVA_MCP_RELAY_URL: http://127.0.0.1:9
      GREEN_API_URL: http://greenapi_mock:8080
      GREEN_API_MEDIA_URL: http://greenapi_mock:8080
      WHATSAPP_SEND_DELAY_SECONDS: "0"
    volumes:
      - invoice_uploads:/app/uploads
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      invoice_db:
        condition: service_healthy
      greenapi_mock:
        condition: service_started

  invoice_admin:
    build:
      context: ./invoice/admin
      args:
        VITE_API_URL: /invoice-api
        VITE_BASE: /invoice-admin/
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - invoice_api

  invoice_client:
    build:
      context: ./invoice/client
      args:
        NEXT_PUBLIC_API_URL: /invoice-api
        NEXT_BASE_PATH: /invoice-portal
    environment:
      API_BACKEND_URL: http://invoice_api:8004
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - invoice_api

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./invoice/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - invoice_api
      - invoice_admin
      - invoice_client
      - greenapi_mock

volumes:
  invoice_db_data:
  invoice_uploads:
  greenapi_mock_data:
