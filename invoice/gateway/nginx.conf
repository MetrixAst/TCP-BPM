server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Invoice API (FastAPI)
    location /invoice-api/ {
        proxy_pass http://invoice_api:8004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Invoice admin SPA (Vite). Built with base=/invoice-admin/
    location /invoice-admin/ {
        proxy_pass http://invoice_admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tenant portal (Next.js basePath=/invoice-portal)
    location /invoice-portal/ {
        proxy_pass http://invoice_client:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Green API mock inspector (local debug)
    location /invoice-mock/ {
        proxy_pass http://greenapi_mock:8080/;
        proxy_set_header Host $host;
    }

    # Flutter mobile web (cache-busted path)
    location /app/ {
        proxy_pass http://host.docker.internal:5555/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_read_timeout 120s;
    }

    # Flutter mobile web static (python http.server 5555 serving /m/)
    location /m/ {
        proxy_pass http://host.docker.internal:5555/m/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_read_timeout 120s;
    }

    # BPM Django
    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
