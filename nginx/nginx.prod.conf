upstream django_proj {
    server web:8000;
}

server {
    listen 80;
    server_name 185-113-132-84.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 185-113-132-84.sslip.io;

    ssl_certificate /etc/letsencrypt/live/185-113-132-84.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/185-113-132-84.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 200M;

    location / {
        proxy_pass http://django_proj;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/static/;
        expires 1d;
    }

    location /media/ {
        alias /home/app/web/media/;
        autoindex off;
    }
}
